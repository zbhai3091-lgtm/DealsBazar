name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    - name: Prepare environment configuration
      run: |
        touch .env
        chmod +x gradlew || true

    - name: Show SHA-1
      continue-on-error: true
      run: |
        if [ -f debug.keystore ]; then
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
        else
          echo "debug.keystore NOT FOUND"
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Verify APK generated
      run: |
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DealsBazar-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.0
        name: Deals Bazar v2.1.0 APK
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
